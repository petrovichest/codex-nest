name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash -n deploy/install.sh deploy/adopt-existing.sh deploy/adopt-existing.test.sh deploy/codexnest
      - run: deploy/adopt-existing.test.sh
      - name: Verify pinned Node.js checksums are published
        run: |
          node_version="$(sed -n 's/^codexnest_node_version="\([^"]*\)"/\1/p' deploy/install.sh)"
          curl -fsSL "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" -o node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-x64.tar.xz$" node-shasums.txt
          grep -Eq "^[0-9a-f]{64}  node-v${node_version}-linux-arm64.tar.xz$" node-shasums.txt

  installer-dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ubuntu:24.04, debian:12]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Validate installer in an isolated distribution
        run: >-
          docker run --rm --platform "${{ matrix.platform }}" --user 1000:1000
          --volume "$PWD:/workspace:ro" --workdir /workspace "${{ matrix.image }}"
          bash deploy/install.sh --dry-run

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync -w @codexnest/client
      - run: ./gradlew assembleDebug
        working-directory: apps/client/android
      - run: ./gradlew lint
        working-directory: apps/client/android

  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @codexnest/protocol
      - run: npm exec -w @codexnest/extension -- playwright install --with-deps chromium
      - run: npm run test:e2e -w @codexnest/extension
        env:
          NODE_ENV: test
      - name: Package the exact extension build exercised by Playwright
        run: npm run package -w @codexnest/extension
      - run: unzip -t apps/extension/artifacts/codexnest-browser-*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexnest-browser-${{ github.sha }}
          path: apps/extension/artifacts/codexnest-browser-*.zip
          if-no-files-found: error

  rolling-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/mvp'
    needs: [verify, installer-dry-run, android-debug, extension-e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: rolling-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check rolling branch head
        id: head
        run: |
          latest_sha="$(git ls-remote origin refs/heads/codex/mvp | cut -f1)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale rolling build for $GITHUB_SHA; branch is at $latest_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: steps.head.outputs.current == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.head.outputs.current == 'true'
        with:
          name: codexnest-browser-${{ github.sha }}
          path: release
      - name: Prepare rolling browser extension
        if: steps.head.outputs.current == 'true'
        run: |
          shopt -s nullglob
          extension_archives=(release/codexnest-browser-*.zip)
          test "${#extension_archives[@]}" -eq 1
          cp "${extension_archives[0]}" release/codexnest-browser-latest.zip
          unzip -t release/codexnest-browser-latest.zip
      - if: steps.head.outputs.current == 'true'
        run: npm ci
      - if: steps.head.outputs.current == 'true'
        run: npm run build
      - if: steps.head.outputs.current == 'true'
        run: npm run android:sync -w @codexnest/client
      - name: Validate Android signing secrets
        if: steps.head.outputs.current == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
      - name: Prepare Android signing key
        if: steps.head.outputs.current == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codexnest.jks"
          chmod 0600 "$RUNNER_TEMP/codexnest.jks"
      - name: Build signed rolling APK
        if: steps.head.outputs.current == 'true'
        id: apk
        env:
          CODEXNEST_KEYSTORE_PATH: ${{ runner.temp }}/codexnest.jks
          CODEXNEST_KEY_ALIAS: ${{ secrets.CODEXNEST_ANDROID_KEY_ALIAS }}
          CODEXNEST_KEYSTORE_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEYSTORE_PASSWORD }}
          CODEXNEST_KEY_PASSWORD: ${{ secrets.CODEXNEST_ANDROID_KEY_PASSWORD }}
        run: |
          package_version="$(node -p "require('../../../package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          export CODEXNEST_ANDROID_VERSION_NAME="$package_version-$short_sha"
          export CODEXNEST_ANDROID_VERSION_CODE="$((1000000 + GITHUB_RUN_NUMBER))"
          ./gradlew assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p ../../../release
          cp app/build/outputs/apk/release/app-release.apk ../../../release/CodexNest-latest.apk
          printf '{"schemaVersion":1,"version":"%s","commit":"%s"}\n' \
            "$CODEXNEST_ANDROID_VERSION_NAME" "$GITHUB_SHA" \
            > ../../../release/CodexNest-latest.json
          printf 'version=%s\n' "$CODEXNEST_ANDROID_VERSION_NAME" >> "$GITHUB_OUTPUT"
        working-directory: apps/client/android
      - name: Prepare rolling installer
        if: steps.head.outputs.current == 'true'
        env:
          ROLLING_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          sed \
            -e "s/^codexnest_default_version=.*/codexnest_default_version=\"$ROLLING_VERSION\"/" \
            -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$GITHUB_SHA\"/" \
            deploy/install.sh > release/install.sh
          chmod 0755 release/install.sh
          grep -Fx "codexnest_default_version=\"$ROLLING_VERSION\"" release/install.sh
          grep -Fx "codexnest_default_ref=\"$GITHUB_SHA\"" release/install.sh
          bash -n release/install.sh
      - name: Check rolling branch head before publish
        if: steps.head.outputs.current == 'true'
        id: publish
        run: |
          latest_sha="$(git ls-remote origin refs/heads/codex/mvp | cut -f1)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale rolling publish for $GITHUB_SHA; branch is at $latest_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish rolling GitHub release
        if: steps.publish.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          notes="$(printf \
            'Automatically updated after successful CI for `%s`.\n\nCommit: `%s`\n\nLinux install:\n\n```bash\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | bash\n```\n\nThe APK, browser extension, and installer are built from the same tested commit.' \
            "$ROLLING_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY")"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest \
              release/CodexNest-latest.apk \
              release/CodexNest-latest.json \
              release/codexnest-browser-*.zip \
              release/install.sh \
              --clobber
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/android-latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
            gh release edit android-latest \
              --prerelease=false \
              --latest \
              --title "CodexNest $ROLLING_VERSION" \
              --notes "$notes"
          else
            gh release create android-latest \
              release/CodexNest-latest.apk \
              release/CodexNest-latest.json \
              release/codexnest-browser-*.zip \
              release/install.sh \
              --latest \
              --target "$GITHUB_SHA" \
              --title "CodexNest $ROLLING_VERSION" \
              --notes "$notes"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, installer-dry-run, android-debug, extension-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codexnest-browser-${{ github.sha }}
          path: release
      - name: Validate release source
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git fetch --no-tags origin codex/mvp
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" FETCH_HEAD
      - name: Validate release version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Prepare installer asset
        run: |
          mkdir -p release
          sed \
            -e "s/^codexnest_default_version=.*/codexnest_default_version=\"$GITHUB_REF_NAME\"/" \
            -e "s/^codexnest_default_ref=.*/codexnest_default_ref=\"$GITHUB_REF_NAME\"/" \
            deploy/install.sh > release/install.sh
          chmod 0755 release/install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/install.sh release/codexnest-browser-*.zip
          --generate-notes --latest=false --verify-tag
