<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodexNest — desktop and mobile</title>
    <style>
      @font-face {
        font-family: Onest;
        src: url("{{FONT}}") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #f8f9f6;
        color: #292a29;
        font-family: Onest, sans-serif;
      }
      .brand {
        position: absolute;
        top: 64px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .brand img {
        width: 52px;
        height: 52px;
      }
      .copy {
        position: absolute;
        top: 208px;
        left: 72px;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.06;
        letter-spacing: -4px;
      }
      .subtitle {
        margin: 26px 0 0;
        font-size: 30px;
        letter-spacing: -1px;
      }
      .note {
        margin-top: 40px;
        font-size: 19px;
        line-height: 1.6;
        color: #6a6c67;
      }
      .platforms {
        position: absolute;
        bottom: 67px;
        left: 72px;
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: 1px;
        color: #6a6c67;
      }
      .desktop {
        position: absolute;
        width: 936px;
        top: 150px;
        right: 56px;
        border-radius: 28px;
        background: #171817;
        overflow: hidden;
        box-shadow:
          0 24px 52px rgb(39 50 26 / 19%),
          0 5px 14px rgb(39 50 26 / 8%);
      }
      .desktop > img {
        display: block;
        width: 100%;
      }
      .phone {
        position: absolute;
        top: 350px;
        left: 446px;
        width: 230px;
        padding: 8px;
        border-radius: 32px;
        background: #f8f9f6;
        box-shadow:
          0 24px 52px rgb(39 50 26 / 19%),
          0 5px 14px rgb(39 50 26 / 8%);
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 24px;
      }
      @media (max-width: 1280px) {
        .brand {
          top: 44px;
          left: 52px;
          font-size: 28px;
          gap: 13px;
        }
        .brand img {
          width: 46px;
          height: 46px;
        }
        .copy {
          top: 157px;
          left: 52px;
        }
        h1 {
          font-size: 62px;
          letter-spacing: -3px;
        }
        .subtitle {
          margin-top: 20px;
          font-size: 25px;
        }
        .note {
          font-size: 16px;
          margin-top: 32px;
        }
        .platforms {
          bottom: 44px;
          left: 52px;
          font-size: 11px;
        }
        .desktop {
          width: 670px;
          right: 36px;
          top: 112px;
          border-radius: 20px;
        }
        .phone {
          width: 170px;
          top: 246px;
          left: 449px;
          padding: 6px;
          border-radius: 24px;
        }
        .phone img {
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="{{LOGO}}" alt="" />CodexNest</div>
    <div class="copy">
      <h1>Your Codex<br />workspace.</h1>
      <p class="subtitle">Desktop and mobile.</p>
      <p class="note">Your projects. Your conversations.<br />On your own Linux machine.</p>
    </div>
    <div class="platforms">SELF-HOSTED<br />BROWSER · ANDROID</div>
    <div class="desktop">
      <img src="{{DESKTOP}}" alt="Project search session on desktop" />
    </div>
    <div class="phone"><img src="{{MOBILE}}" alt="The same session on mobile" /></div>
  </body>
</html>
