<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodexNest — one ChatGPT account, all your devices</title>
    <style>
      @font-face {
        font-family: Onest;
        src: url("{{FONT}}") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #ffffff;
        color: #292a29;
        font-family: Onest, sans-serif;
        text-align: center;
      }
      .brand {
        position: absolute;
        top: 38px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.6px;
      }
      .brand img {
        width: 40px;
        height: 40px;
      }
      .platforms {
        position: absolute;
        top: 47px;
        right: 60px;
        margin: 0;
        color: #646660;
        font-size: 17px;
      }
      header {
        position: absolute;
        inset: 115px 40px auto;
        z-index: 1;
      }
      h1 {
        margin: 0;
        color: #181918;
        font-size: 64px;
        line-height: 1.08;
        font-weight: 600;
        letter-spacing: -2.4px;
      }
      .subtitle {
        margin: 16px 0 0;
        color: #646660;
        font-size: 25px;
        line-height: 34px;
      }
      .scene {
        position: absolute;
        top: 293px;
        left: 160px;
        width: 1280px;
      }
      .illustration {
        display: block;
        width: 100%;
        height: auto;
      }
      .host {
        position: absolute;
        top: 345px;
        left: 50%;
        width: 410px;
        transform: translateX(-50%);
        font-size: 23px;
        line-height: 32px;
        font-weight: 500;
      }
      .host small {
        display: block;
        color: #646660;
        font-size: 18px;
        font-weight: 400;
        line-height: 27px;
      }
      .unlimited {
        position: absolute;
        top: 422px;
        left: 50%;
        transform: translateX(-50%);
        color: #20211f;
        font-size: 64px;
        line-height: 50px;
      }
      footer {
        position: absolute;
        inset: auto 50px 34px;
        color: #646660;
        font-size: 19px;
        line-height: 29px;
      }
      footer p {
        margin: 0;
      }
      footer p:first-child {
        color: #292a29;
        font-weight: 500;
      }
      @media (max-width: 1280px) {
        .brand {
          top: 28px;
          left: 44px;
          gap: 10px;
          font-size: 23px;
        }
        .brand img {
          width: 34px;
          height: 34px;
        }
        .platforms {
          top: 35px;
          right: 44px;
          font-size: 15px;
        }
        header {
          top: 82px;
        }
        h1 {
          font-size: 49px;
          letter-spacing: -1.8px;
        }
        .subtitle {
          margin-top: 10px;
          font-size: 20px;
          line-height: 28px;
        }
        .scene {
          top: 204px;
          left: 175px;
          width: 930px;
        }
        .host {
          top: 253px;
          width: 360px;
          font-size: 19px;
          line-height: 26px;
        }
        .host small {
          font-size: 15px;
          line-height: 24px;
        }
        .unlimited {
          top: 311px;
          font-size: 49px;
          line-height: 38px;
        }
        footer {
          bottom: 22px;
          font-size: 15px;
          line-height: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="{{LOGO}}" alt="" />CodexNest</div>
    <p class="platforms">Self-hosted · Browser · Android</p>
    <header>
      <h1>One ChatGPT account.<br />All your devices.</h1>
      <p class="subtitle">Shared projects, conversations and progress.</p>
    </header>
    <main class="scene">
      <img
        class="illustration"
        src="{{ILLUSTRATION}}"
        alt="Four thin clients connected to one headless Linux host"
      />
      <div class="host">Codex + CodexNest backend<small>On your headless Linux host</small></div>
      <div class="unlimited">∞</div>
    </main>
    <footer>
      <p>Your development environment stays on the server.</p>
      <p>Connect through WireGuard, Tailscale or a trusted LAN.</p>
    </footer>
  </body>
</html>
